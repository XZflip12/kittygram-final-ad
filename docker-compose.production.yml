volumes:
  pg_data:
  static:
  media:

services:
  db:
    image: postgres:13
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
  backend:
    image: xzflip12/kittygram_backend:latest
    env_file: .env
    volumes:
      - media:/backend_media
      - static:/backend_static
  frontend:
    image: xzflip12/kittygram_frontend:latest
    env_file: .env
    command: cp -r /app/build/. /frontend_static/
    volumes:
      - static:/frontend_static
  gateway:
    image: xzflip12/kittygram_gateway:latest
    env_file: .env
    ports:
      - 9000:80
    volumes:
      - media:/backend_media
      - static:/backend_static
      - static:/frontend_static

